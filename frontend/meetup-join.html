<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>약속 참여</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    main { padding-bottom: 120px; } /* 아래 고정 저장 바에 내용이 가리지 않도록 */

    /* 출발역 검색 */
    .picker { position: relative; }
    .suggest { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 5; list-style: none; margin: 0; padding: 6px; background: white; border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08); max-height: 260px; overflow-y: auto; }
    .suggest li { padding: 10px 12px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
    .suggest li:hover, .suggest li.active { background: var(--primary-soft); }
    .suggest .lines-text { color: var(--muted); font-size: 13px; }
    .picked { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 6px 12px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-weight: 700; font-size: 14px; }

    /* 일정 넣기 (선택) */
    .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; }
    .toggle b { display: block; font-size: 15px; }
    .toggle small { color: var(--muted); font-size: 13px; }
    .switch { position: relative; flex: none; width: 46px; height: 28px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch span { position: absolute; inset: 0; border-radius: 999px; background: #d1d5db; transition: background 0.15s; }
    .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: white; transition: transform 0.15s; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2); }
    .switch input:checked + span { background: var(--primary); }
    .switch input:checked + span::after { transform: translateX(18px); }
    .schedule-area { margin-top: 16px; }

    .savebar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); border-top: 1px solid var(--border); z-index: 20; }
    .savebar-inner { max-width: 560px; margin: 0 auto; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
    .savebar .error { margin: 0 0 8px; }
    .done { color: var(--success); font-weight: 600; font-size: 14px; margin: 0 0 8px; }
    .done:empty { display: none; }
    .danger-zone { text-align: center; margin-top: 8px; }
    .save-default { display: flex; gap: 10px; align-items: flex-start; padding: 4px 4px 0; cursor: pointer; }
    .save-default input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--primary); }
    .save-default b { display: block; font-size: 14px; }
    .save-default small { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html"><span class="brand-mark">📍</span>모임 장소 추천</a>
      <a class="back" id="back-link" href="#">← 약속으로</a>
    </div>
  </header>

  <main>
    <section class="page-title">
      <h1 id="form-title">약속에 참여하기</h1>
      <p class="sub">사는 곳 근처 역만 고르면 돼요. 정확한 주소는 묻지 않아요.</p>
    </section>

    <form id="join-form" novalidate>
      <section class="card">
        <div class="field">
          <label class="field-label" for="nickname">닉네임</label>
          <input id="nickname" type="text" maxlength="30" placeholder="친구들이 알아볼 이름" required autocomplete="off" />
        </div>
        <div class="field">
          <label class="field-label" for="station-input">출발역</label>
          <div class="picker">
            <input id="station-input" type="text" placeholder="역 이름 검색 (예: 강남, 홍대)" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="suggest" />
            <ul class="suggest" id="suggest" role="listbox" hidden></ul>
          </div>
          <span class="picked" id="picked" hidden></span>
        </div>
      </section>

      <section class="card">
        <label class="toggle" for="use-schedule">
          <span><b>일정도 넣을래요</b><small>바쁜 시간을 칠하면 모두 비는 시간도 추천해 줘요</small></span>
          <span class="switch"><input id="use-schedule" type="checkbox" /><span></span></span>
        </label>
        <div class="schedule-area" id="schedule-area" hidden>
          <div id="busy-grid"></div>
          <p class="hint">바쁜 시간을 <b>누르거나 드래그</b>해서 칠해요. 칠한 칸을 누르면 고칠 수 있어요.</p>
        </div>
      </section>

      <section class="card">
        <span class="field-label">선호하는 시간대 <span class="optional">(선택)</span></span>
        <div class="chips" id="preferred"></div>
      </section>

      <label class="save-default" id="save-default-box" hidden>
        <input id="save-default" type="checkbox" checked />
        <span><b>내 기본 정보로도 저장</b><small>다음 약속에 들어갈 때 출발역과 일정이 자동으로 채워져요</small></span>
      </label>

      <div class="danger-zone">
        <button id="delete-btn" class="btn btn-danger-text" type="button" hidden>참여 취소하기</button>
      </div>

      <div class="savebar">
        <div class="savebar-inner">
          <p id="error" class="error" role="alert"></p>
          <p id="done" class="done"></p>
          <button id="submit-btn" class="btn btn-primary btn-block" type="submit">참여하기</button>
        </div>
      </div>
    </form>
  </main>

  <script src="api.js"></script>
  <script src="ui.js"></script>
  <script src="busy-grid.js"></script>
  <script>
    // ?mine=1 이면 약속 없이 "내 기본 정보"(출발역·일정)만 이 브라우저에 저장하는 화면이 된다
    const params = new URLSearchParams(location.search);
    const isMine = params.has("mine");
    const meetupId = params.get("id");
    const meetupUrl = isMine ? "index.html?mode=general" : "meetup.html?id=" + meetupId;
    document.getElementById("back-link").href = meetupUrl;
    if (isMine) document.getElementById("back-link").textContent = "← 처음으로";
    const saveDefault = document.getElementById("save-default");
    const errorBox = document.getElementById("error");
    const submitBtn = document.getElementById("submit-btn");
    const deleteBtn = document.getElementById("delete-btn");

    document.getElementById("nickname").value = loadLastNickname();
    document.getElementById("preferred").innerHTML = PREFERRED_TIMES
      .map((t) => `<label class="chip"><input type="checkbox" value="${t}" /><span>${t}</span></label>`)
      .join("");

    // ===== 일정 (선택) =====
    const grid = createBusyGrid(document.getElementById("busy-grid"), { days: WEEK_DAYS, startH: 9, endH: 23 });
    const useSchedule = document.getElementById("use-schedule");
    useSchedule.addEventListener("change", () => {
      document.getElementById("schedule-area").hidden = !useSchedule.checked;
    });

    // ===== 출발역 검색 =====
    let stations = [];
    let pickedStation = null;
    let activeIndex = 0;
    const stationInput = document.getElementById("station-input");
    const suggest = document.getElementById("suggest");
    const picked = document.getElementById("picked");

    function pick(station) {
      pickedStation = station;
      stationInput.value = station.name;
      picked.textContent = "🚇 " + station.name + "역에서 출발";
      picked.hidden = false;
      closeSuggest();
    }

    function closeSuggest() {
      suggest.hidden = true;
      stationInput.setAttribute("aria-expanded", "false");
    }

    function showSuggest() {
      const q = stationInput.value.trim().replace(/역$/, "");
      const matches = (q ? stations.filter((s) => s.name.includes(q)) : stations.filter((s) => s.hot >= 5))
        .sort((a, b) => Number(!a.name.startsWith(q)) - Number(!b.name.startsWith(q)))
        .slice(0, 8);
      suggest.replaceChildren();
      if (matches.length === 0) {
        const li = document.createElement("li");
        li.textContent = "목록에 없는 역이에요. 가까운 다른 역을 골라 주세요.";
        li.style.cursor = "default";
        suggest.appendChild(li);
      }
      activeIndex = 0;
      matches.forEach((s, i) => {
        const li = document.createElement("li");
        li.setAttribute("role", "option");
        if (i === 0) li.classList.add("active");
        const name = document.createElement("span");
        name.textContent = s.name;
        const lines = document.createElement("span");
        lines.className = "lines-text";
        lines.textContent = s.lines.map((l) => (l.length > 2 ? l : l + "호선")).join(" · ");
        li.append(name, lines);
        li.addEventListener("mousedown", (e) => { e.preventDefault(); pick(s); });
        suggest.appendChild(li);
      });
      suggest.matches = matches;
      suggest.hidden = false;
      stationInput.setAttribute("aria-expanded", "true");
    }

    stationInput.addEventListener("focus", showSuggest);
    stationInput.addEventListener("input", () => {
      pickedStation = null;
      picked.hidden = true;
      showSuggest();
    });
    stationInput.addEventListener("blur", closeSuggest);
    // 화살표로 고르고 Enter로 선택한다
    stationInput.addEventListener("keydown", (e) => {
      const items = [...suggest.querySelectorAll("li[role=option]")];
      if (suggest.hidden || items.length === 0) return;
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        items[activeIndex].classList.remove("active");
        activeIndex = (activeIndex + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length;
        items[activeIndex].classList.add("active");
      } else if (e.key === "Enter") {
        e.preventDefault();
        pick(suggest.matches[activeIndex]);
      } else if (e.key === "Escape") {
        closeSuggest();
      }
    });

    // ===== 내 정보 불러오기 (이 브라우저에서 참여했던 경우) =====
    let editing = null;

    async function init() {
      try {
        const { ok, data } = await getStations();
        if (ok) stations = data.stations;
      } catch (e) {
        errorBox.textContent = "서버에 연결할 수 없어요. 백엔드가 켜져 있는지 확인해요.";
        return;
      }

      const myProfile = loadMyProfile("general");

      if (isMine) {
        document.getElementById("form-title").textContent = "내 기본 정보";
        document.querySelector(".page-title .sub").textContent =
          "출발역과 일정을 한 번 넣어 두면 약속에 들어갈 때마다 자동으로 채워져요. 이 브라우저에만 저장돼요.";
        document.title = "내 기본 정보";
        submitBtn.textContent = "내 정보 저장";
        if (myProfile) fillForm(myProfile);
        return;
      }

      await loadMine();
      // 이 약속에 처음 참여하는 거라면 저장해 둔 기본 정보로 미리 채운다
      if (!editing && myProfile) {
        fillForm(myProfile);
        showToast("저장해 둔 내 정보를 불러왔어요");
      }
      document.getElementById("save-default-box").hidden = false;
    }

    async function loadMine() {
      const saved = loadMeetupToken(meetupId);
      if (!saved) return;
      const { ok, data } = await getMeetup(meetupId);
      if (!ok) return;
      const mine = data.members.find((m) => m.memberId === saved.memberId);
      if (!mine) {
        clearMeetupToken(meetupId);
        return;
      }
      fillForm(fromServerMember(mine));
      editing = saved;
      document.getElementById("form-title").textContent = "내 정보 수정";
      submitBtn.textContent = "수정 내용 저장";
      deleteBtn.hidden = false;
    }

    // 화면 형식 { nickname, stationId, busy, preferredTimes }로 입력칸을 채운다
    function fillForm(me) {
      if (me.nickname) document.getElementById("nickname").value = me.nickname;
      const station = stations.find((s) => s.id === me.stationId);
      if (station) pick(station);
      useSchedule.checked = Boolean(me.busy);
      document.getElementById("schedule-area").hidden = !me.busy;
      grid.set(me.busy || []);
      document.querySelectorAll("#preferred input").forEach((c) => {
        c.checked = (me.preferredTimes || []).includes(c.value);
      });
    }

    // ===== 저장 =====
    document.getElementById("join-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      errorBox.textContent = "";

      const nicknameInput = document.getElementById("nickname");
      if (!nicknameInput.value.trim() && !isMine) {
        errorBox.textContent = "닉네임을 입력해 주세요.";
        nicknameInput.focus();
        return;
      }
      if (!pickedStation) {
        errorBox.textContent = "출발역을 목록에서 골라 주세요.";
        stationInput.focus();
        return;
      }

      const payload = {
        nickname: nicknameInput.value.trim(),
        stationId: pickedStation.id,
        busy: useSchedule.checked ? grid.get() : null,
        preferredTimes: [...document.querySelectorAll("#preferred input:checked")].map((c) => c.value),
      };

      // 기본 정보 화면: 서버에 보내지 않고 이 브라우저에만 저장한다
      if (isMine) {
        if (!storeMyProfile("general", { ...payload, stationName: pickedStation.name })) {
          errorBox.textContent = "이 브라우저에서는 저장할 수 없어요. (사생활 보호 모드인지 확인해 주세요)";
          return;
        }
        if (payload.nickname) storeLastNickname(payload.nickname);
        location.href = meetupUrl + "&mineSaved=1";
        return;
      }

      submitBtn.disabled = true;
      try {
        const { ok, status, data } = editing
          ? await updateMeetupMember(meetupId, editing.memberId, editing.editToken, payload)
          : await joinMeetup(meetupId, payload);

        if (!ok) {
          if (editing && (status === 403 || status === 404)) {
            clearMeetupToken(meetupId);
            errorBox.textContent = "이 정보를 수정할 수 없어요. 새로고침한 뒤 다시 참여해 주세요.";
            return;
          }
          errorBox.textContent = errorText(data, "저장하지 못했어요.");
          return;
        }

        storeLastNickname(payload.nickname);
        if (saveDefault.checked) storeMyProfile("general", { ...payload, stationName: pickedStation.name });
        if (!editing) storeMeetupToken(meetupId, data.memberId, data.editToken);
        document.getElementById("done").textContent = "저장했어요! 추천 결과로 이동해요…";
        setTimeout(() => { location.href = meetupUrl + "&saved=1"; }, 600);
      } catch (e) {
        errorBox.textContent = "서버에 연결할 수 없어요. 백엔드가 켜져 있는지 확인해요.";
      } finally {
        submitBtn.disabled = false;
      }
    });

    deleteBtn.addEventListener("click", async () => {
      if (!editing || !confirm("약속 참여를 취소할까요? 추천 결과에서도 빠져요.")) return;
      try {
        const { ok, data } = await deleteMeetupMember(meetupId, editing.memberId, editing.editToken);
        if (!ok) {
          errorBox.textContent = errorText(data, "취소하지 못했어요.");
          return;
        }
        clearMeetupToken(meetupId);
        location.href = meetupUrl + "&deleted=1";
      } catch (e) {
        errorBox.textContent = "서버에 연결할 수 없어요. 백엔드가 켜져 있는지 확인해요.";
      }
    });

    init();
  </script>
</body>
</html>
