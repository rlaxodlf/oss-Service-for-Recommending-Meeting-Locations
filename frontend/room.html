<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>모임 방</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .pill { background: white; border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--muted); }
    .pill b { color: var(--text); }

    /* 초대 */
    .card.highlight { border: 2px solid var(--primary); background: linear-gradient(180deg, var(--primary-soft), white 70%); }
    .share-row { display: flex; gap: 8px; }
    .share-row input { flex: 1; min-width: 0; font-size: 14px; color: var(--muted); background: #f9fafb; }
    .share-row .btn { flex: none; }

    /* 팀원 */
    .members { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .member { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border: 1px solid var(--border); border-radius: 999px; font-size: 14px; font-weight: 600; }
    .avatar { width: 26px; height: 26px; border-radius: 50%; color: white; display: grid; place-items: center; font-size: 12px; font-weight: 800; }
    .me-badge { font-size: 11px; font-weight: 700; color: var(--primary); background: var(--primary-soft); border-radius: 999px; padding: 1px 6px; }

    /* 추천 결과 */
    .best { border-radius: 14px; background: var(--primary); color: white; padding: 18px; margin-bottom: 10px; }
    .best .label { font-size: 13px; font-weight: 700; opacity: 0.85; }
    .best .when { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin: 4px 0 2px; }
    .best .dur { font-size: 14px; opacity: 0.9; }
    .best .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .best .tag { background: rgba(255, 255, 255, 0.18); border-radius: 999px; padding: 3px 10px; font-size: 12px; }

    .slot-list { list-style: none; margin: 0; padding: 0; }
    .slot { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--border); }
    .slot:last-child { border-bottom: none; }
    .slot .rank { flex: none; width: 24px; color: var(--muted); font-weight: 700; font-size: 14px; text-align: center; }
    .slot .info { flex: 1; min-width: 0; }
    .slot .when { font-weight: 700; }
    .slot .reason { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .score { flex: none; font-size: 13px; font-weight: 700; color: var(--primary); background: var(--primary-soft); border-radius: 999px; padding: 3px 10px; }

    .icon-btn { background: none; border: 1px solid var(--border); border-radius: 10px; width: 36px; height: 36px; cursor: pointer; font-size: 16px; color: var(--muted); }
    .icon-btn:hover { color: var(--text); background: #f9fafb; }
    .icon-btn.spin { animation: spin 0.6s linear; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .soon { opacity: 0.7; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html"><span class="brand-mark">📍</span>모임 장소 추천</a>
    </div>
  </header>

  <main id="main">
    <p id="error" class="error alert"></p>

    <div id="room-view" hidden>
      <section class="page-title">
        <h1 id="room-name"></h1>
        <div class="meta">
          <span class="pill">최소 <b id="min-minutes"></b></span>
          <span class="pill"><b id="member-count"></b> 참여</span>
        </div>
      </section>

      <!-- 초대: 방을 막 만들었으면 맨 위에 강조해서 보여 준다 -->
      <section class="card" id="invite-card">
        <div class="card-head">
          <div>
            <h2 id="invite-title">팀원 초대</h2>
            <p class="sub" id="invite-sub">링크를 받은 사람은 누구나 시간표를 등록할 수 있어요.</p>
          </div>
        </div>
        <div class="share-row">
          <input id="invite-link" type="text" readonly aria-label="초대 링크" />
          <button id="copy-btn" class="btn btn-soft btn-sm" type="button">복사</button>
          <button id="share-btn" class="btn btn-primary btn-sm" type="button" hidden>공유</button>
        </div>
      </section>

      <!-- 팀원과 내 시간표 -->
      <section class="card" id="member-card">
        <div class="card-head">
          <h2>참여한 팀원</h2>
        </div>
        <div class="members" id="member-list"></div>
        <p id="member-empty" class="sub" style="margin-bottom:16px">아직 아무도 등록하지 않았어요. 첫 번째로 등록해 보세요!</p>
        <a id="join-btn" class="btn btn-primary btn-block" href="#">내 시간표 등록하기</a>
      </section>

      <!-- 공통 시간 추천 -->
      <section class="card" id="result-card">
        <div class="card-head">
          <div>
            <h2>언제 만날까요?</h2>
            <p class="sub">모두 비는 평일 09:00~18:00 중에서 골랐어요</p>
          </div>
          <button id="refresh-btn" class="icon-btn" type="button" aria-label="새로고침" title="새로고침">↻</button>
        </div>
        <div id="slot-loading"><div class="loading"></div><div class="loading"></div></div>
        <div id="best"></div>
        <ol id="slot-list" class="slot-list"></ol>
        <button id="more-btn" class="btn btn-text btn-block" type="button" hidden></button>
        <div id="slot-empty" class="empty" hidden></div>
        <p id="slot-error" class="error"></p>
      </section>

      <section class="card soon" id="place-card">
        <h2>어디서 만날까요?</h2>
        <p class="sub" style="margin-top:4px">시간을 고르면 모두에게 가까운 장소를 추천해 줄 거예요. 곧 추가돼요!</p>
      </section>
    </div>
  </main>

  <script src="api.js"></script>
  <script src="ui.js"></script>
  <script>
    // 주소의 쿼리스트링(?id=...)에서 방 번호를 읽는다
    const params = new URLSearchParams(location.search);
    const roomId = params.get("id");
    const errorBox = document.getElementById("error");
    const DAY_FULL = { mon: "월요일", tue: "화요일", wed: "수요일", thu: "목요일", fri: "금요일" };
    const SHOW_COUNT = 4; // 1위를 뺀 나머지 중 처음에 보여 줄 개수

    let allSlots = [];
    let showAll = false;

    // 다른 화면에서 넘어오며 남긴 알림을 보여 주고, 새로고침해도 다시 뜨지 않게 주소에서 지운다
    if (params.get("saved")) showToast("시간표를 저장했어요 ✔");
    if (params.get("deleted")) showToast("시간표를 삭제했어요");
    const isNew = params.get("new") === "1";
    if (params.has("saved") || params.has("deleted") || isNew) {
      history.replaceState(null, "", "room.html?id=" + roomId);
    }

    async function loadRoom() {
      if (!roomId) {
        errorBox.textContent = "방 번호가 없어요. 받은 초대 링크를 다시 확인해 주세요.";
        return;
      }
      try {
        const { ok, data } = await getRoom(roomId);

        if (!ok) {
          errorBox.textContent = errorText(data);
          return;
        }
        errorBox.textContent = "";
        showRoom(data);
        loadRecommendations();
      } catch (e) {
        errorBox.textContent = "서버에 연결할 수 없어요. 백엔드가 켜져 있는지 확인해요.";
      }
    }

    function showRoom(room) {
      document.title = room.name + " · 모임 장소 추천";
      document.getElementById("room-name").textContent = room.name;
      document.getElementById("min-minutes").textContent = formatMinutes(room.minMinutes);
      document.getElementById("member-count").textContent = room.members.length + "명";

      // 이 브라우저에서 이미 시간표를 등록했다면 등록 대신 수정으로 안내한다
      const saved = loadEditToken(roomId);
      const mine = saved && room.members.find((m) => m.scheduleId === saved.scheduleId);

      const list = document.getElementById("member-list");

      // 기존 목록 초기화
      list.replaceChildren();

      // 등록된 멤버 닉네임 표시
      room.members.forEach((m) => {
        const nickname = typeof m === "string" ? m : m.nickname;
        const chip = document.createElement("span");
        chip.className = "member";
        const avatar = document.createElement("span");
        avatar.className = "avatar";
        avatar.style.background = avatarColor(nickname);
        avatar.textContent = [...nickname][0];
        chip.append(avatar, document.createTextNode(nickname));
        if (mine && m.scheduleId === mine.scheduleId) {
          const badge = document.createElement("span");
          badge.className = "me-badge";
          badge.textContent = "나";
          chip.appendChild(badge);
        }
        list.appendChild(chip);
      });
      document.getElementById("member-empty").hidden = room.members.length > 0;

      const joinBtn = document.getElementById("join-btn");
      joinBtn.href = "schedule.html?id=" + roomId;
      if (mine) {
        joinBtn.textContent = "내 시간표 수정하기";
        joinBtn.className = "btn btn-outline btn-block";
      }

      // 초대 링크에는 방 번호만 남긴다
      document.getElementById("invite-link").value = location.origin + location.pathname + "?id=" + roomId;
      if (isNew) {
        const invite = document.getElementById("invite-card");
        invite.classList.add("highlight");
        document.getElementById("invite-title").textContent = "🎉 방이 만들어졌어요!";
        document.getElementById("invite-sub").textContent = "이 링크를 조별과제 단톡방에 보내 주세요.";
      } else {
        // 평소에는 초대보다 결과가 더 중요하므로 초대 카드를 아래로 보낸다
        document.getElementById("room-view").insertBefore(
          document.getElementById("invite-card"), document.getElementById("place-card"));
      }

      document.getElementById("room-view").hidden = false;
    }

    // ===== 공통 시간 추천 =====
    async function loadRecommendations() {
      const slotError = document.getElementById("slot-error");
      slotError.textContent = "";

      try {
        const { ok, data } = await getRecommendations(roomId);
        document.getElementById("slot-loading").hidden = true;
        if (!ok) {
          slotError.textContent = errorText(data, "추천 결과를 불러오지 못했어요.");
          return;
        }

        const emptyEl = document.getElementById("slot-empty");
        allSlots = data.recommendations;
        if (data.memberCount === 0) {
          emptyEl.innerHTML = '<span class="emoji">🗓️</span>시간표가 모이면 여기에 추천 시간이 나와요.';
        } else if (allSlots.length === 0) {
          emptyEl.innerHTML = '<span class="emoji">😥</span>모두 비는 시간이 없어요.<br />최소 회의 시간을 줄이거나 시간표를 다시 확인해 보세요.';
        }
        emptyEl.hidden = allSlots.length > 0 && data.memberCount > 0;
        renderSlots();
      } catch (e) {
        document.getElementById("slot-loading").hidden = true;
        slotError.textContent = "서버에 연결할 수 없어요. 백엔드가 켜져 있는지 확인해요.";
      }
    }

    function renderSlots() {
      const bestEl = document.getElementById("best");
      const listEl = document.getElementById("slot-list");
      const moreBtn = document.getElementById("more-btn");
      bestEl.replaceChildren();
      listEl.replaceChildren();
      if (allSlots.length === 0) {
        moreBtn.hidden = true;
        return;
      }

      // 1위는 크게 강조한다. 서버 응답 값만 들어가지만 textContent로 일관되게 채운다
      const [first, ...rest] = allSlots;
      const best = document.createElement("div");
      best.className = "best";
      best.innerHTML = '<div class="label">👍 가장 추천해요</div><div class="when"></div><div class="dur"></div><div class="tags"></div>';
      best.querySelector(".when").textContent = `${DAY_FULL[first.day] ?? first.day} ${first.start} ~ ${first.end}`;
      best.querySelector(".dur").textContent = formatMinutes(first.duration) + " 동안 모두 비어 있어요";
      (first.reasons || []).forEach((r) => {
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = r;
        best.querySelector(".tags").appendChild(tag);
      });
      bestEl.appendChild(best);

      const visible = showAll ? rest : rest.slice(0, SHOW_COUNT);
      visible.forEach((slot, i) => {
        const li = document.createElement("li");
        li.className = "slot";
        li.innerHTML = '<span class="rank"></span><div class="info"><div class="when"></div><div class="reason"></div></div><span class="score"></span>';
        li.querySelector(".rank").textContent = i + 2;
        li.querySelector(".when").textContent = `${DAY_LABELS[slot.day] ?? slot.day} ${slot.start} ~ ${slot.end}`;
        li.querySelector(".reason").textContent = formatMinutes(slot.duration) + (slot.reasons?.length ? " · " + slot.reasons.join(" · ") : "");
        li.querySelector(".score").textContent = slot.score + "점";
        listEl.appendChild(li);
      });

      moreBtn.hidden = rest.length <= SHOW_COUNT;
      moreBtn.textContent = showAll ? "접기" : `${rest.length - SHOW_COUNT}개 더 보기`;
    }

    document.getElementById("more-btn").addEventListener("click", () => {
      showAll = !showAll;
      renderSlots();
    });

    function formatMinutes(minutes) {
      const h = Math.floor(minutes / 60);
      const m = minutes % 60;
      const parts = [];
      if (h) parts.push(h + "시간");
      if (m) parts.push(m + "분");
      return parts.join(" ");
    }

    const refreshBtn = document.getElementById("refresh-btn");
    refreshBtn.addEventListener("click", async () => {
      refreshBtn.classList.remove("spin");
      void refreshBtn.offsetWidth; // 애니메이션을 다시 시작하기 위해 레이아웃을 강제로 계산한다
      refreshBtn.classList.add("spin");
      await loadRoom();
      showToast("최신 상태로 불러왔어요");
    });

    // 다른 탭(카톡 등)에 다녀오면 팀원이 새로 등록했을 수 있으니 자동으로 다시 불러온다
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") loadRoom();
    });

    // ===== 초대 링크 복사·공유 =====
    document.getElementById("copy-btn").addEventListener("click", async () => {
      const link = document.getElementById("invite-link");
      try {
        await navigator.clipboard.writeText(link.value);
        showToast("링크를 복사했어요. 단톡방에 붙여넣어 주세요");
      } catch (e) {
        // 클립보드를 쓸 수 없는 환경에서는 링크를 선택해 두어 직접 복사하게 한다
        link.select();
        showToast("링크를 선택했어요. Ctrl+C로 복사해 주세요");
      }
    });

    // 휴대폰처럼 공유 기능이 있는 브라우저에서는 카톡 등으로 바로 보낼 수 있게 한다
    const shareBtn = document.getElementById("share-btn");
    if (navigator.share) {
      shareBtn.hidden = false;
      shareBtn.addEventListener("click", () => {
        navigator.share({
          title: document.getElementById("room-name").textContent,
          text: "조별과제 회의 시간 정하게 시간표 등록해 주세요!",
          url: document.getElementById("invite-link").value,
        }).catch(() => { /* 사용자가 공유를 취소한 경우 */ });
      });
    }

    loadRoom();
  </script>
</body>
</html>
