<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>모임 방</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header><a href="index.html">📍 모임 장소 추천</a></header>

  <main>
    <p id="error" class="error"></p>

    <!-- 초대 카드: 방 생성 직후 가장 먼저 보여 주며, 초대 링크 표시와 복사 버튼을 제공한다 -->
    <section class="card" id="invite-card" hidden>
      <h2>👋 팀원을 초대해요</h2>
      <p class="hint">이 링크를 카카오톡 단체방에 보내면, 팀원이 각자 시간표를 등록할 수 있어요.</p>
      <input id="invite-link" type="text" readonly />
      <button id="copy-btn" type="button">초대 링크 복사</button>
    </section>

    <section class="card" id="room-card" hidden>
      <h2 id="room-name"></h2>
      <div class="info-row"><span>최소 회의 시간</span><span id="min-minutes"></span></div>
      <div class="info-row"><span>참여 인원</span><span id="member-count"></span></div>
    </section>

    <section class="card" id="join-card" hidden>
      <h2 id="join-title">내 시간표 등록하기</h2>
      <p class="hint" id="join-hint">닉네임과 수업 시간을 입력하면 팀원들과 공통 공강을 찾을 수 있어요.</p>
      <a id="join-btn" href="#"><button type="button" id="join-btn-label">참여하고 시간표 등록</button></a>
    </section>

    <section class="card" id="member-card" hidden>
      <h2>참여 멤버</h2>
      <ul id="member-list"></ul>
      <p id="member-empty" class="empty">아직 참여한 사람이 없어요.</p>
    </section>

    <section class="card" id="result-card" hidden>
      <div class="card-head">
        <h2>언제 만날까요?</h2>
        <button id="refresh-btn" class="small secondary" type="button">새로고침</button>
      </div>
      <p class="hint">모두 비는 시간(평일 09:00~18:00)을 점수 순으로 보여 줘요.</p>
      <ol id="slot-list" class="slot-list"></ol>
      <p id="slot-empty" class="empty" hidden></p>
      <p id="slot-error" class="error"></p>
    </section>

    <section class="card" id="place-card" hidden>
      <h2>어디서 만날까요?</h2>
      <p class="empty">장소 추천은 준비 중이에요.</p>
    </section>
  </main>

  <script src="api.js"></script>
  <script>
    // 주소의 쿼리스트링(?id=...)에서 방 번호를 읽는다
    const roomId = new URLSearchParams(location.search).get("id");
    const errorBox = document.getElementById("error");

    async function loadRoom() {
      if (!roomId) {
        errorBox.textContent = "방 번호가 없어요.";
        return;
      }
      try {
        const { ok, data } = await getRoom(roomId);

        if (!ok) {
          errorBox.textContent = errorText(data);
          return;
        }
        showRoom(data);
        loadRecommendations();
      } catch (e) {
        errorBox.textContent = "서버에 연결할 수 없어요. 백엔드가 켜져 있는지 확인해요.";
      }
    }

    function showRoom(room) {
      document.getElementById("room-name").textContent = room.name;
      document.getElementById("min-minutes").textContent = room.minMinutes + "분";
      document.getElementById("member-count").textContent = room.members.length + "명";

      const list = document.getElementById("member-list");

      // 기존 목록 초기화
      list.replaceChildren();

      // 등록된 멤버 닉네임 표시
      room.members.forEach((m) => {
        const li = document.createElement("li");
        li.textContent = typeof m === "string" ? m : m.nickname;
        list.appendChild(li);
      });
      document.getElementById("member-empty").hidden = room.members.length > 0;

      // 이 브라우저에서 이미 시간표를 등록했다면 등록 대신 수정으로 안내한다
      const saved = loadEditToken(roomId);
      const mine = saved && room.members.find((m) => m.scheduleId === saved.scheduleId);
      if (mine) {
        document.getElementById("join-title").textContent = "내 시간표";
        document.getElementById("join-hint").textContent = `"${mine.nickname}"(으)로 등록했어요. 수업이 바뀌면 고칠 수 있어요.`;
        document.getElementById("join-btn-label").textContent = "내 시간표 수정하기";
      }

      // 초대 링크에는 방 번호만 남긴다
      document.getElementById("invite-link").value = location.origin + location.pathname + "?id=" + roomId;
      document.getElementById("invite-card").hidden = false;
      document.getElementById("join-btn").href = "schedule.html?id=" + roomId;
      document.getElementById("join-card").hidden = false;
      document.getElementById("room-card").hidden = false;
      document.getElementById("member-card").hidden = false;
      document.getElementById("result-card").hidden = false;
      document.getElementById("place-card").hidden = false;
    }

    // ===== 공통 시간 추천 =====
    async function loadRecommendations() {
      const listEl = document.getElementById("slot-list");
      const emptyEl = document.getElementById("slot-empty");
      const slotError = document.getElementById("slot-error");
      slotError.textContent = "";

      try {
        const { ok, data } = await getRecommendations(roomId);
        if (!ok) {
          slotError.textContent = errorText(data, "추천 결과를 불러오지 못했어요.");
          return;
        }

        listEl.replaceChildren();
        if (data.memberCount === 0) {
          emptyEl.textContent = "아직 시간표를 등록한 사람이 없어요.";
        } else if (data.recommendations.length === 0) {
          emptyEl.textContent = "모두 비는 시간이 없어요. 최소 회의 시간을 줄이거나 시간표를 다시 확인해 보세요.";
        }
        emptyEl.hidden = data.memberCount > 0 && data.recommendations.length > 0;

        data.recommendations.forEach((slot, i) => listEl.appendChild(renderSlot(slot, i)));
      } catch (e) {
        slotError.textContent = "서버에 연결할 수 없어요. 백엔드가 켜져 있는지 확인해요.";
      }
    }

    // 추천 시간대 하나를 카드로 만든다. 사용자 입력이 섞이지 않지만 textContent로 일관되게 채운다
    function renderSlot(slot, index) {
      const li = document.createElement("li");
      li.className = "slot" + (index === 0 ? " best" : "");

      const top = document.createElement("div");
      top.className = "slot-top";
      const when = document.createElement("strong");
      when.textContent = `${DAY_LABELS[slot.day] ?? slot.day} ${slot.start}~${slot.end}`;
      const score = document.createElement("span");
      score.className = "score";
      score.textContent = slot.score + "점";
      top.append(when, score);

      const meta = document.createElement("div");
      meta.className = "hint";
      meta.textContent = formatDuration(slot.duration) + (index === 0 ? " · 가장 추천해요" : "");

      li.append(top, meta);

      if (slot.reasons && slot.reasons.length > 0) {
        const reasons = document.createElement("ul");
        reasons.className = "reasons";
        slot.reasons.forEach((r) => {
          const item = document.createElement("li");
          item.textContent = r;
          reasons.appendChild(item);
        });
        li.appendChild(reasons);
      }
      return li;
    }

    function formatDuration(minutes) {
      const h = Math.floor(minutes / 60);
      const m = minutes % 60;
      const parts = [];
      if (h) parts.push(h + "시간");
      if (m) parts.push(m + "분");
      return parts.join(" ") + " 비어 있어요";
    }

    document.getElementById("refresh-btn").addEventListener("click", loadRoom);

    // 현재 주소를 클립보드에 복사하고 버튼 문구를 바꾼다
    document.getElementById("copy-btn").addEventListener("click", async () => {
      const link = document.getElementById("invite-link");
      try {
        await navigator.clipboard.writeText(link.value);
        document.getElementById("copy-btn").textContent = "복사됨! ✔";
      } catch (e) {
        // 클립보드를 쓸 수 없는 환경에서는 링크를 선택해 두어 직접 복사하게 한다
        link.select();
        document.getElementById("copy-btn").textContent = "링크를 선택했어요. Ctrl+C로 복사해 주세요";
      }
    });

    loadRoom();
  </script>
</body>
</html>
