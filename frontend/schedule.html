<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>시간표 등록</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    main { padding-bottom: 120px; } /* 아래 고정 저장 바에 내용이 가리지 않도록 */

    .count { font-size: 13px; font-weight: 700; color: var(--primary); background: var(--primary-soft); border-radius: 999px; padding: 2px 10px; margin-left: 6px; vertical-align: 2px; }

    /* ===== 캡처로 자동 채우기 ===== */
    .dropzone {
      display: flex; align-items: center; gap: 12px; width: 100%;
      padding: 14px; margin-bottom: 14px;
      border: 1.5px dashed #c7d2fe; border-radius: 12px; background: #fafaff;
      font: inherit; text-align: left; cursor: pointer; color: var(--text);
    }
    .dropzone:hover, .dropzone.over { border-color: var(--primary); background: var(--primary-soft); }
    .dropzone .icon { font-size: 24px; }
    .dropzone b { display: block; font-size: 15px; }
    .dropzone small { color: var(--muted); font-size: 13px; }
    .capture { display: flex; gap: 12px; align-items: center; margin: -4px 0 14px; }
    .capture img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); }
    .capture .grow { flex: 1; min-width: 0; }
    .capture .status { font-size: 13px; color: var(--muted); margin: 0 0 6px; }

    /* 시간표 격자 스타일은 style.css에 있다 (일반 모드 일정 격자와 함께 쓴다) */

    .confirm { display: flex; gap: 8px; align-items: center; margin-top: 12px; padding: 12px; border-radius: 12px; background: #fffbeb; font-size: 14px; font-weight: 600; cursor: pointer; }
    .confirm input { width: 18px; height: 18px; accent-color: var(--primary); }

    /* ===== 아래 고정 저장 바 ===== */
    .savebar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); border-top: 1px solid var(--border); z-index: 20; }
    .savebar-inner { max-width: 560px; margin: 0 auto; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
    .savebar .error { margin: 0 0 8px; }
    .done { color: var(--success); font-weight: 600; font-size: 14px; margin: 0 0 8px; }
    .done:empty { display: none; }

    .danger-zone { text-align: center; margin-top: 8px; }
    .save-default { display: flex; gap: 10px; align-items: flex-start; padding: 4px 4px 0; cursor: pointer; }
    .save-default input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--primary); }
    .save-default b { display: block; font-size: 14px; }
    .save-default small { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html"><span class="brand-mark">📍</span>모임 장소 추천</a>
      <a class="back" id="back-link" href="#">← 방으로</a>
    </div>
  </header>

  <main>
    <section class="page-title">
      <h1 id="form-title">내 시간표 등록</h1>
      <p class="sub">수업이 있는 시간만 칠하면 나머지는 공강으로 계산해요.</p>
    </section>

    <form id="schedule-form" novalidate>
      <section class="card">
        <label class="field-label" for="nickname">닉네임</label>
        <input id="nickname" type="text" maxlength="30" placeholder="팀원들이 알아볼 이름 (예: 민영)" required autocomplete="off" />
      </section>

      <section class="card">
        <div class="card-head">
          <h2>수업 시간<span class="count" id="class-count">0개</span></h2>
          <button id="clear-btn" class="btn btn-text btn-sm" type="button" hidden>모두 지우기</button>
        </div>

        <!-- 캡처로 자동 채우기: 파일 선택, 끌어다 놓기, Ctrl+V 붙여넣기 모두 가능 -->
        <input id="image" type="file" accept="image/png,image/jpeg" hidden />
        <button id="dropzone" class="dropzone" type="button">
          <span class="icon">📷</span>
          <span><b>시간표 캡처로 자동 채우기</b><small>캡처를 고르거나 끌어다 놓기 · Ctrl+V로 붙여넣기 (png/jpg, 5MB)</small></span>
        </button>
        <div class="capture" id="capture" hidden>
          <img id="preview" alt="시간표 미리보기" />
          <div class="grow">
            <p class="status" id="parse-status"></p>
            <button id="parse-btn" class="btn btn-soft btn-sm" type="button">캡처 분석하기</button>
          </div>
        </div>

        <div class="tt" id="tt"></div>
        <p class="hint">빈 칸을 <b>누르거나 드래그</b>해서 수업을 추가해요. 칠한 칸을 누르면 고칠 수 있어요.</p>

        <div class="editor" id="editor" hidden>
          <div class="editor-head">
            <span>선택한 수업</span>
            <button id="ed-close" class="btn btn-text btn-sm" type="button">완료</button>
          </div>
          <div class="editor-grid">
            <select id="ed-day" aria-label="요일"></select>
            <input id="ed-start" type="time" step="600" aria-label="시작 시각" />
            <input id="ed-end" type="time" step="600" aria-label="끝 시각" />
            <input id="ed-room" class="room" type="text" placeholder="강의실 (예: 새빛관 104)" aria-label="강의실" />
          </div>
          <div class="editor-actions">
            <span></span>
            <button id="ed-delete" class="btn btn-danger-text btn-sm" type="button">이 수업 지우기</button>
          </div>
        </div>

        <label class="confirm" id="confirm-box" hidden>
          <input id="confirmed" type="checkbox" /> 자동으로 읽은 시간표를 확인했어요
        </label>
      </section>

      <section class="card">
        <span class="field-label">선호하는 시간대 <span class="optional">(선택)</span></span>
        <div class="chips" id="preferred"></div>
        <p class="hint">고른 시간대가 추천 순위에서 앞으로 와요.</p>
      </section>

      <label class="save-default" id="save-default-box" hidden>
        <input id="save-default" type="checkbox" checked />
        <span><b>내 기본 시간표로도 저장</b><small>다음 방에 들어갈 때 자동으로 채워져요</small></span>
      </label>

      <div class="danger-zone">
        <button id="delete-btn" class="btn btn-danger-text" type="button" hidden>내 시간표 삭제</button>
      </div>

      <div class="savebar">
        <div class="savebar-inner">
          <p id="error" class="error" role="alert"></p>
          <p id="done" class="done"></p>
          <button id="submit-btn" class="btn btn-primary btn-block" type="submit">시간표 저장</button>
        </div>
      </div>
    </form>
  </main>

  <script src="api.js"></script>
  <script src="ui.js"></script>
  <script>
    // ?mine=1 이면 방 없이 "내 기본 시간표"만 이 브라우저에 저장하는 화면이 된다
    const params = new URLSearchParams(location.search);
    const isMine = params.has("mine");
    const roomId = params.get("id");
    const roomUrl = isMine ? "index.html?mode=student" : "room.html?id=" + roomId;
    document.getElementById("back-link").href = roomUrl;
    if (isMine) document.getElementById("back-link").textContent = "← 처음으로";
    const errorBox = document.getElementById("error");

    // 선호 시간대 칩을 PREFERRED_TIMES 목록으로 생성한다
    document.getElementById("preferred").innerHTML = PREFERRED_TIMES
      .map((t) => `<label class="chip"><input type="checkbox" value="${t}" /><span>${t}</span></label>`)
      .join("");

    // 처음 등록할 때는 마지막으로 쓴 닉네임을 미리 채운다
    document.getElementById("nickname").value = loadLastNickname();

    // ===== 시간표 격자 =====
    // 수업 목록(classes)이 실제 데이터이고, 격자는 이를 시각적으로 보여 주는 뷰이다.
    const START_H = 9;   // 격자가 시작하는 시각(시)
    const END_H = 21;    // 격자가 끝나는 시각(시)
    const HOUR_PX = 44;  // 1시간에 해당하는 높이(px). CSS의 --hour 값과 같아야 한다
    const STEP = 30;     // 드래그 한 칸의 단위(분)
    const COLORS = ["#fecaca", "#fde68a", "#bbf7d0", "#bfdbfe", "#ddd6fe", "#fbcfe8", "#a7f3d0", "#fed7aa"];

    let classes = [];    // 수업 목록. 형식: [{ day, start, end, room }]
    let selected = -1;   // 편집 중인 수업의 인덱스 (없으면 -1)

    const tt = document.getElementById("tt");
    const editor = document.getElementById("editor");
    const edDay = document.getElementById("ed-day");
    const edStart = document.getElementById("ed-start");
    const edEnd = document.getElementById("ed-end");
    const edRoom = document.getElementById("ed-room");
    edDay.innerHTML = DAYS.map((d) => `<option>${d}</option>`).join("");

    const toMin = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
    const toTime = (m) => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
    const minToPx = (m) => ((m - START_H * 60) / 60) * HOUR_PX;

    // 격자 뼈대(요일 헤더, 시각 눈금, 요일별 칸)를 한 번만 생성한다
    tt.style.setProperty("--hour", HOUR_PX + "px");
    tt.style.setProperty("--days", DAYS.length);
    const bodyHeight = (END_H - START_H) * HOUR_PX;
    let html = `<div class="tt-corner"></div>` + DAYS.map((d) => `<div class="tt-head">${d}</div>`).join("");
    // 시각 눈금 열과 요일 열을 같은 행에 배치한다
    html += `<div class="tt-times" style="height:${bodyHeight}px">` +
      Array.from({ length: END_H - START_H }, (_, i) =>
        `<span style="top:${i * HOUR_PX}px">${START_H + i}</span>`).join("") + `</div>`;
    html += DAYS.map((d) => `<div class="tt-col" data-day="${d}" style="height:${bodyHeight}px"></div>`).join("");
    tt.innerHTML = html;
    const cols = [...tt.querySelectorAll(".tt-col")];

    // classes 배열을 읽어 요일 칸마다 수업 사각형을 다시 그린다
    function render() {
      cols.forEach((c) => c.querySelectorAll(".block").forEach((b) => b.remove()));
      classes.forEach((c, i) => {
        const col = cols.find((x) => x.dataset.day === c.day);
        if (!col || !c.start || !c.end) return;
        const top = Math.max(0, minToPx(toMin(c.start)));
        const height = Math.max(16, minToPx(toMin(c.end)) - top);
        const b = document.createElement("div");
        b.className = "block" + (i === selected ? " selected" : "") + (c.room ? "" : " missing");
        b.style.top = top + "px";
        b.style.height = height + "px";
        b.style.background = COLORS[i % COLORS.length];
        // innerHTML 대신 textContent를 사용해 강의실 입력값이 HTML로 해석되지 않도록 한다
        b.textContent = c.room || "강의실?";
        const time = document.createElement("small");
        time.textContent = c.start + "~" + c.end;
        b.appendChild(time);
        b.addEventListener("pointerdown", (e) => e.stopPropagation()); // 사각형 위에서는 새 수업 드래그가 시작되지 않도록 이벤트 전파를 막는다
        b.addEventListener("click", () => select(i));
        col.appendChild(b);
      });
      document.getElementById("class-count").textContent = classes.length + "개";
      document.getElementById("clear-btn").hidden = classes.length === 0;
    }

    function select(i) {
      selected = i;
      editor.hidden = i < 0;
      if (i >= 0) {
        const c = classes[i];
        edDay.value = c.day; edStart.value = c.start; edEnd.value = c.end; edRoom.value = c.room || "";
      }
      render();
    }

    // 편집 칸의 입력값을 선택된 수업에 반영하고 격자를 다시 그린다
    function applyEditor() {
      if (selected < 0) return;
      classes[selected] = { day: edDay.value, start: edStart.value, end: edEnd.value, room: edRoom.value.trim() };
      render();
    }
    [edDay, edStart, edEnd, edRoom].forEach((el) => el.addEventListener("input", applyEditor));
    // 강의실 입력 후 Enter를 누르면 폼이 제출되지 않고 편집만 끝낸다
    edRoom.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); select(-1); }
    });
    document.getElementById("ed-close").addEventListener("click", () => select(-1));
    document.getElementById("ed-delete").addEventListener("click", () => {
      classes.splice(selected, 1);
      select(-1);
    });
    document.getElementById("clear-btn").addEventListener("click", () => {
      if (!confirm("칠한 수업을 모두 지울까요?")) return;
      classes = [];
      select(-1);
    });

    // 드래그로 수업 추가: 빈 칸에서 포인터를 누른 채 끌면 해당 시간 범위의 수업이 생성된다
    let drag = null;
    const slotAt = (col, clientY) => {
      const y = clientY - col.getBoundingClientRect().top;
      const min = START_H * 60 + Math.floor(y / HOUR_PX * 60 / STEP) * STEP;
      return Math.min(Math.max(min, START_H * 60), END_H * 60 - STEP);
    };

    cols.forEach((col) => {
      col.addEventListener("pointerdown", (e) => {
        if (e.target !== col) return;
        col.setPointerCapture(e.pointerId);
        const s = slotAt(col, e.clientY);
        const ghost = document.createElement("div");
        ghost.className = "ghost";
        col.appendChild(ghost);
        // 한 번 누르기만 해도 보통 수업 길이인 1시간 30분을 만든다
        drag = { col, anchor: s, lo: s, hi: s + STEP, ghost, moved: false };
        drawGhost();
      });
      col.addEventListener("pointermove", (e) => {
        if (!drag || drag.col !== col) return;
        const cur = slotAt(col, e.clientY);
        if (cur !== drag.anchor) drag.moved = true;
        drag.lo = Math.min(drag.anchor, cur);
        drag.hi = Math.max(drag.anchor, cur) + STEP;
        drawGhost();
      });
      col.addEventListener("pointerup", () => {
        if (!drag || drag.col !== col) return;
        drag.ghost.remove();
        const hi = drag.moved ? drag.hi : Math.min(drag.lo + 90, END_H * 60);
        classes.push({ day: col.dataset.day, start: toTime(drag.lo), end: toTime(hi), room: "" });
        drag = null;
        select(classes.length - 1); // 생성 직후 해당 수업을 선택해 강의실을 바로 입력할 수 있게 한다
        edRoom.focus();
      });
      col.addEventListener("pointercancel", () => {
        if (drag) { drag.ghost.remove(); drag = null; }
      });
    });
    function drawGhost() {
      drag.ghost.style.top = minToPx(drag.lo) + "px";
      drag.ghost.style.height = minToPx(drag.hi) - minToPx(drag.lo) + "px";
    }

    render();

    // ===== 캡처 분석: 이미지를 서버로 보내고, 받은 수업 목록을 격자에 반영한다 =====
    const parseBtn = document.getElementById("parse-btn");
    const parseStatus = document.getElementById("parse-status");
    const confirmBox = document.getElementById("confirm-box");
    const confirmed = document.getElementById("confirmed");
    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("image");

    // 분석 대상 이미지. 파일 선택, 끌어다 놓기, 붙여넣기 중 마지막으로 입력된 것을 사용한다
    let selectedFile = null;
    const preview = document.getElementById("preview");

    function setImage(file) {
      if (!IMAGE_TYPES.includes(file.type)) {
        showToast("png 또는 jpg 파일만 올릴 수 있어요");
        return;
      }
      if (file.size > MAX_IMAGE_MB * 1024 * 1024) {
        showToast(`파일이 너무 커요. ${MAX_IMAGE_MB}MB 이하로 올려 주세요`);
        return;
      }
      selectedFile = file;
      preview.src = URL.createObjectURL(file);
      document.getElementById("capture").hidden = false;
      parseStatus.textContent = "이미지를 받았어요.";
      parseBtn.hidden = false;
    }

    dropzone.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (e) => {
      if (e.target.files[0]) setImage(e.target.files[0]);
      fileInput.value = ""; // 같은 파일을 다시 골라도 change가 발생하도록 비운다
    });
    dropzone.addEventListener("dragover", (e) => { e.preventDefault(); dropzone.classList.add("over"); });
    dropzone.addEventListener("dragleave", () => dropzone.classList.remove("over"));
    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropzone.classList.remove("over");
      if (e.dataTransfer.files[0]) setImage(e.dataTransfer.files[0]);
    });

    // 클립보드 붙여넣기(Ctrl+V): 이미지가 있으면 받고, 텍스트만 있으면 기본 동작을 그대로 둔다
    document.addEventListener("paste", (e) => {
      const item = [...e.clipboardData.items].find((i) => i.type.startsWith("image/"));
      if (!item) return;
      e.preventDefault();
      setImage(item.getAsFile());
    });

    parseBtn.addEventListener("click", async () => {
      if (!selectedFile) return;
      parseBtn.disabled = true;
      parseStatus.textContent = "분석 중이에요… 잠시만 기다려 주세요.";
      try {
        const { ok, data } = await parseSchedule(roomId, selectedFile);
        if (!ok || !Array.isArray(data.classes)) {
          throw new Error(errorText(data, "분석 실패"));
        }
        classes = data.classes.map((c) => ({ ...c }));
        select(-1);
        confirmed.checked = false;
        confirmBox.hidden = false;
        parseStatus.textContent = `수업 ${data.classes.length}개를 읽었어요. 틀린 칸은 눌러서 고쳐 주세요.`;
        parseBtn.textContent = "다시 분석하기";
      } catch (e) {
        // 분석 실패 시 수동 입력(격자 직접 칠하기)으로 안내한다
        parseStatus.textContent = "캡처를 읽지 못했어요. 아래 시간표를 직접 칠해 주세요.";
      } finally {
        parseBtn.disabled = false;
      }
    });

    // ===== 내 시간표 불러오기: 이 브라우저에 수정 토큰이 있으면 등록 대신 수정 화면으로 연다 =====
    const submitBtn = document.getElementById("submit-btn");
    const deleteBtn = document.getElementById("delete-btn");
    const doneBox = document.getElementById("done");
    let editing = null; // { scheduleId, editToken } — 수정 중일 때만 값이 있다

    function enterEditMode(saved) {
      editing = saved;
      document.getElementById("form-title").textContent = "내 시간표 수정";
      document.title = "시간표 수정";
      submitBtn.textContent = "수정 내용 저장";
      deleteBtn.hidden = false;
    }

    async function loadMine() {
      const saved = loadEditToken(roomId);
      if (!saved) return;
      try {
        const { ok, data } = await getSchedules(roomId);
        if (!ok) return;
        const mine = data.schedules.find((s) => s.scheduleId === saved.scheduleId);
        if (!mine) {
          clearEditToken(roomId); // 이미 삭제된 시간표의 토큰은 지운다
          return;
        }
        fillForm(fromServerSchedule(mine));
        enterEditMode(saved);
      } catch (e) {
        // 불러오지 못하면 새로 등록하는 화면 그대로 둔다
      }
    }

    // 화면 형식 시간표 { nickname, classes, preferredTimes }로 입력칸을 채운다
    function fillForm(schedule) {
      if (schedule.nickname) document.getElementById("nickname").value = schedule.nickname;
      document.querySelectorAll("#preferred input").forEach((c) => {
        c.checked = (schedule.preferredTimes || []).includes(c.value);
      });
      classes = (schedule.classes || []).map((c) => ({ ...c }));
      select(-1);
    }

    const saveDefault = document.getElementById("save-default");

    async function init() {
      const myProfile = loadMyProfile("student");

      if (isMine) {
        document.getElementById("form-title").textContent = "내 기본 시간표";
        document.querySelector(".page-title .sub").textContent =
          "한 번 넣어 두면 방에 들어갈 때마다 자동으로 채워져요. 이 브라우저에만 저장돼요.";
        document.title = "내 기본 시간표";
        submitBtn.textContent = "내 시간표 저장";
        if (myProfile) fillForm(myProfile);
        return;
      }

      await loadMine();
      // 이 방에 처음 등록하는 거라면 저장해 둔 기본 시간표로 미리 채운다
      if (!editing && myProfile) {
        fillForm(myProfile);
        showToast("저장해 둔 내 시간표를 불러왔어요");
      }
      document.getElementById("save-default-box").hidden = false;
    }

    // ===== 저장: 검증과 계산은 서버가 담당하고, 화면은 요청 전송과 결과 표시만 한다 =====
    document.getElementById("schedule-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      errorBox.textContent = "";
      doneBox.textContent = "";

      const nicknameInput = document.getElementById("nickname");
      if (!nicknameInput.value.trim() && !isMine) {
        errorBox.textContent = "닉네임을 입력해 주세요.";
        nicknameInput.focus();
        return;
      }

      // 분석 결과를 사용한 경우, 사용자가 확인 체크를 해야 저장할 수 있다
      if (!confirmBox.hidden && !confirmed.checked) {
        errorBox.textContent = "자동으로 읽은 시간표를 확인한 뒤 체크해 주세요.";
        confirmBox.scrollIntoView({ behavior: "smooth", block: "center" });
        return;
      }

      // 강의실이 빈 수업이 있으면 그 수업을 선택해 바로 입력하게 한다 (서버도 같은 검사를 한다)
      const missing = classes.findIndex((c) => !c.room);
      if (missing >= 0) {
        select(missing);
        editor.scrollIntoView({ behavior: "smooth", block: "center" });
        edRoom.focus();
        errorBox.textContent = "강의실이 빠진 수업이 있어요. 빨간 점선 칸의 강의실을 입력해 주세요.";
        return;
      }

      const payload = {
        nickname: nicknameInput.value.trim(),
        preferredTimes: [...document.querySelectorAll("#preferred input:checked")].map((c) => c.value),
        classes: classes.map((c) => ({ ...c })),
      };

      // 기본 시간표 화면: 서버에 보내지 않고 이 브라우저에만 저장한다
      if (isMine) {
        if (!storeMyProfile("student", payload)) {
          errorBox.textContent = "이 브라우저에서는 저장할 수 없어요. (사생활 보호 모드인지 확인해 주세요)";
          return;
        }
        if (payload.nickname) storeLastNickname(payload.nickname);
        location.href = roomUrl + "&mineSaved=1";
        return;
      }

      submitBtn.disabled = true;
      try {
        const { ok, status, data } = editing
          ? await updateSchedule(roomId, editing.scheduleId, editing.editToken, payload)
          : await saveSchedule(roomId, payload);

        if (!ok) {
          if (editing && (status === 403 || status === 404)) {
            errorBox.textContent = "이 시간표를 수정할 수 없어요. 새로고침한 뒤 다시 등록해 주세요.";
            clearEditToken(roomId);
            return;
          }
          errorBox.textContent = errorText(data, "저장하지 못했어요.");
          return;
        }

        storeLastNickname(payload.nickname);
        if (saveDefault.checked) storeMyProfile("student", payload);
        if (!editing) {
          // 수정·삭제에 필요한 토큰을 이 브라우저에 보관한다
          storeEditToken(roomId, data.scheduleId, data.editToken);
        }
        // 저장이 끝나면 바로 방으로 돌아가 결과를 보여 준다
        doneBox.textContent = "저장했어요! 결과 화면으로 이동해요…";
        setTimeout(() => { location.href = roomUrl + "&saved=1"; }, 600);
      } catch (e) {
        errorBox.textContent = "서버에 연결할 수 없어요. 백엔드가 켜져 있는지 확인해요.";
      } finally {
        submitBtn.disabled = false;
      }
    });

    // ===== 삭제 =====
    deleteBtn.addEventListener("click", async () => {
      if (!editing || !confirm("내 시간표를 삭제할까요? 팀 결과에서도 빠져요.")) return;
      errorBox.textContent = "";
      try {
        const { ok, data } = await deleteSchedule(roomId, editing.scheduleId, editing.editToken);
        if (!ok) {
          errorBox.textContent = errorText(data, "삭제하지 못했어요.");
          return;
        }
        clearEditToken(roomId);
        location.href = roomUrl + "&deleted=1";
      } catch (e) {
        errorBox.textContent = "서버에 연결할 수 없어요. 백엔드가 켜져 있는지 확인해요.";
      }
    });

    init();
  </script>
</body>
</html>
